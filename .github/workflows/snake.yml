name: Generate Snake, 3D & Pacman

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-animations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake SVG
        uses: Platane/snk@v3
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=#FCD000&color_dots=#1a1a2e,#16213e,#0f3460,#533483,#7b2cbf&color_background=#0d1117

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Move 3D graph to dist
        run: |
          sudo chmod -R 777 dist
          sudo cp -r profile-3d-contrib dist/

      - name: Generate Pac-Man Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.SNAKE_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
